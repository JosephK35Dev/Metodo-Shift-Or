<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shift-Or</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">

<!-- 1. ENCABEZADO COMPACTO -->
<header class="top">
<img class="logo" src="img/logo-ufps.png" data-i18n-attr="alt:logoAlt" alt="" onerror="this.onerror=function(){this.style.display='none'};this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRLYRDeAyduSAIcGYXU8zMh8ydMIRvGXAL5zj9GN-qG_SU9Be1tSneByVo&amp;s=10'">
<div>
<p class="uni">Universidad Francisco de Paula Santander</p>
<h1 data-i18n="h1"></h1>
<p class="author" data-i18n="author"></p>
</div>
<button id="lang" class="langbtn" type="button"></button>
</header>

<!-- 2. ETAPAS -->
<nav id="nav" data-i18n-attr="aria-label:navAria"></nav>

<main class="layout">

<!-- Guía de la etapa (a la derecha en escritorio, arriba en móvil). Lo escribe ui.js -->
<section class="card guide" id="stage" aria-labelledby="stTitle"></section>

<!-- 3. SIMULADOR (lo principal) -->
<div class="sim">

<section class="card" id="freeBox" hidden data-i18n-attr="aria-label:freeAria">
<div class="free">
<div><label for="pat" data-i18n="lblPat"></label><input id="pat" maxlength="24" value="GATO" autocomplete="off" aria-describedby="hint"></div>
<div><label for="txt" data-i18n="lblTxt"></label><input id="txt" maxlength="80" value="EL GAXO ESTÁ AQUÍ" autocomplete="off"></div>
</div>
<p id="hint" class="note" data-i18n="hint"></p>
</section>

<section class="card controls" data-i18n-attr="aria-label:ctrlAria">
<div class="ctrl" role="group" data-i18n-attr="aria-label:playAria">
<button id="bPrev" data-i18n="bPrev"></button>
<button id="bNext" class="pri" data-i18n="bNext"></button>
<button id="bPlay" aria-pressed="false"></button>
<button id="bReset" data-i18n="bReset"></button>
</div>
<div class="row2"><span id="prog" class="note"></span><div class="chips" id="chips" data-i18n-attr="aria-label:chipsAria"></div></div>
<!-- Velocidad fija (oculta): ui.js la lee. Para eliminarla del todo, borra también sus 2 usos en ui.js -->
<input id="spd" type="range" min="1" max="10" value="4" hidden aria-hidden="true" tabindex="-1">
</section>

<!-- ui.js dibuja aquí: texto y patrón, explicación del paso, coincidencias y bits -->
<div id="view"></div>
</div>
</main>

<!-- 4. INFORMACIÓN SECUNDARIA (al final y plegada) -->
<details class="card more">
<summary data-i18n="sum1"></summary>
<div data-i18n="det1"></div>
</details>

<details class="card more">
<summary data-i18n="sum2"></summary>
<div data-i18n="det2"></div>
</details>

</div>

<!-- 5. PIE DE PÁGINA (datos académicos). Reemplaza los campos marcados con [COMPLETAR] -->
<footer class="site-footer">
<div class="foot-in">
<h2 data-i18n="foot_h"></h2>
<dl class="meta">
<div><dt data-i18n="f_author"></dt><dd data-i18n="v_author"></dd></div>
<div><dt data-i18n="f_mail"></dt><dd data-i18n="todo_mail"></dd></div>
<div><dt data-i18n="f_date"></dt><dd data-i18n="v_date"></dd></div>
<div><dt data-i18n="f_course"></dt><dd data-i18n="todo_course"></dd></div>
<div><dt data-i18n="f_degree"></dt><dd data-i18n="todo_degree"></dd></div>
<div><dt data-i18n="f_uni"></dt><dd>Universidad Francisco de Paula Santander (UFPS)</dd></div>
<div><dt data-i18n="f_loc"></dt><dd>Cúcuta, Norte de Santander, Colombia</dd></div>
<div><dt data-i18n="f_prof"></dt><dd data-i18n="todo_prof"></dd></div>
<div class="wide"><dt data-i18n="f_repo"></dt><dd><a href="#" id="repo" data-i18n="todo_repo"></a></dd></div>
</dl>
</div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/algorithm.js"></script>
<script src="js/verify.js"></script>
<script src="js/stages.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
